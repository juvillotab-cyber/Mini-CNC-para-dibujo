<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CNC Dashboard</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:monospace; background:#121212; color:#e0e0e0; padding:20px; max-width:700px; margin:auto; }
  h1 { text-align:center; color:#4fc3f7; margin-bottom:8px; }
  .sub { text-align:center; color:#666; font-size:12px; margin-bottom:20px; }
  .card { background:#1e1e1e; border:1px solid #333; border-radius:8px; padding:20px; margin-bottom:16px; }
  label { display:block; margin-bottom:8px; color:#888; }
  input[type=file] { width:100%; padding:8px; background:#2a2a2a; color:#ccc; border:1px solid #444; border-radius:4px; }
  button { padding:10px 24px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; font-size:14px; }
  .btn-row { display:flex; gap:10px; margin-top:12px; }
  .btn-upload { background:#1565c0; color:white; }
  .btn-start  { background:#2e7d32; color:white; }
  .btn-start:disabled { background:#444; color:#888; cursor:not-allowed; }
  .progress-bar { width:100%; height:24px; background:#333; border-radius:4px; overflow:hidden; margin:12px 0; }
  .progress-fill { height:100%; background:#4fc3f7; width:0%; transition:width 0.3s; }
  .status { text-align:center; font-size:13px; color:#aaa; }
  #log { background:#0a0a0a; border:1px solid #333; border-radius:4px; padding:10px; height:300px; overflow-y:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .log-err { color:#ef5350; }
  .log-ok  { color:#66bb6a; }
</style>
</head>
<body>

<h1>Mini CNC Dashboard</h1>
<div class="sub">Browser → Flask → HTTP → ESP32 → UART → STM32</div>

<div class="card">
  <label>Seleccionar archivo .nc</label>
  <input type="file" id="fileInput" accept=".nc,.txt,.gcode">
  <div class="btn-row">
    <button class="btn-upload" onclick="uploadFile()">Subir al ESP32</button>
    <button class="btn-start" id="btnStart" disabled onclick="startJob()">Iniciar trabajo</button>
  </div>
</div>

<div class="card">
  <div class="status" id="statusText">Esperando archivo...</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="status" id="lineInfo"></div>
</div>

<div class="card">
  <label>Log</label>
  <div id="log"></div>
</div>

<script>
var linesLoaded = 0;
var evtSource = null;

function log(msg, cls) {
  var el = document.getElementById("log");
  el.innerHTML += '<span class="' + (cls||'') + '">' + msg + '</span>\n';
  el.scrollTop = el.scrollHeight;
}

async function uploadFile() {
  var fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) { alert("Selecciona un archivo .nc"); return; }

  var formData = new FormData();
  formData.append("file", fileInput.files[0]);

  document.getElementById("statusText").textContent = "Enviando al ESP32...";
  var resp = await fetch("/upload", { method:"POST", body:formData });
  var data = await resp.json();

  if (data.status === "ok") {
    linesLoaded = data.lines;
    document.getElementById("btnStart").disabled = false;
    document.getElementById("statusText").textContent = "Archivo en ESP32: " + linesLoaded + " lineas";
    log("[OK] " + data.lines + " lineas cargadas en ESP32", "log-ok");
  } else {
    document.getElementById("statusText").textContent = "Error";
    log("[ERROR] " + data.msg, "log-err");
  }
}

async function startJob() {
  if (!linesLoaded) return;
  document.getElementById("btnStart").disabled = true;
  document.getElementById("statusText").textContent = "Iniciando...";
  document.getElementById("progressFill").style.width = "0%";

  if (evtSource) evtSource.close();
  evtSource = new EventSource("/status");
  evtSource.onmessage = function(e) {
    var d = JSON.parse(e.data);
    var pct = d.total ? Math.round(d.sent/d.total*100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("lineInfo").textContent = d.sent + " / " + d.total;
    if (!d.running && d.sent >= d.total && d.total > 0) {
      document.getElementById("statusText").textContent = "Completado: " + d.total + " lineas";
      document.getElementById("btnStart").disabled = false;
      evtSource.close();
    }
  };

  var resp = await fetch("/start", { method:"POST" });
  var data = await resp.json();
  if (data.status === "ok") {
    document.getElementById("statusText").textContent = "ESP32 enviando lineas...";
  } else {
    log("[ERROR] " + data.msg, "log-err");
    document.getElementById("btnStart").disabled = false;
  }
}
</script>

</body>
</html>
